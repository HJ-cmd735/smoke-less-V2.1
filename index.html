<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png">
<title>SmokeLess TW</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
button,input{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 96px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:5px 0}.small,.muted{color:#6b7280;font-size:12px}.card{background:#fff;border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 5px 22px #0000000c}
.center{text-align:center}.count{font-size:68px;font-weight:850;line-height:1;margin:10px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#111827}
.btn{border:0;border-radius:15px;background:#f3f4f6;padding:12px 15px}.primary{background:#111827;color:#fff;font-weight:750}.wide{width:100%;padding:15px;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f3f4f6;border-radius:16px;padding:14px}.n{font-size:24px;font-weight:800;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
input{width:125px;border:1px solid #d1d5db;border-radius:11px;padding:9px;text-align:center}.reason-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reason{border:1px solid #e5e7eb;border-radius:14px;padding:11px 5px;background:#fff}.week{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:12px}.wb{flex:1;text-align:center}
.cw{height:105px;display:flex;align-items:flex-end;justify-content:center}.col{width:70%;background:#111827;border-radius:8px 8px 3px 3px;min-height:3px}
.calhead{display:flex;justify-content:space-between;align-items:center}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.dow,.day{text-align:center;font-size:12px}.dow{color:#6b7280}
.day{min-height:54px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:6px 2px}.empty{border:0}.today{outline:2px solid #111827}.ok{background:#ecfdf5}.warn{background:#fffbeb}.over{background:#fef2f2}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;border-top:1px solid #e5e7eb;padding:8px 8px calc(env(safe-area-inset-bottom) + 7px)}
.tab{border:0;background:transparent;color:#6b7280;padding:7px}.tab b{display:block;font-size:20px}.tab.active{color:#111827}.page{display:none}.page.active{display:block}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>  
</head><body>
<div class="app"><div class="top"><div><h1>🚭 SmokeLess TW</h1><div id="date" class="small"></div></div><button id="undoBtn" class="btn">復原</button></div>
<section id="home" class="page active">
<div class="card center"><div class="muted">今天抽菸</div><div id="count" class="count">0</div><div>目標 <b id="goal">10</b> 支</div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="muted"></div><button id="recordBtn" class="btn primary wide" style="margin-top:16px">🚬 記錄一支</button></div>
<div class="card"><b>⏱️ 距離上一支</b><div id="since" style="font-size:31px;font-weight:800;margin-top:8px">尚未紀錄</div><div id="last" class="small"></div></div>
<div class="grid2"><div class="stat"><div class="small">本週平均</div><div id="avg" class="n">0</div><div class="small">支 / 天</div></div><div class="stat"><div class="small">連續達標</div><div id="streak" class="n">0</div><div class="small">天</div></div></div>
<div class="card"><b>📊 最近 7 天</b><div id="week" class="week"></div></div><div class="card"><b>🕐 今日紀錄</b><div id="logs"></div></div></section>
<section id="calendar" class="page"><div class="card"><div class="calhead"><button id="prevMonth" class="btn">‹</button><b id="mtitle"></b><button id="nextMonth" class="btn">›</button></div><div id="cal" class="cal"></div></div><div class="card"><b id="selTitle">日期明細</b><div id="selLogs"></div></div></section>
<section id="stats" class="page"><div class="grid2"><div class="stat"><div class="small">本月總量</div><div id="mTotal" class="n">0</div><div class="small">支</div></div><div class="stat"><div class="small">本月花費</div><div id="mCost" class="n">$0</div></div></div><div class="card"><b>🧠 抽菸原因</b><div id="rstats"></div></div><div class="card"><b>📉 30 天變化</b><div id="tstats"></div></div></section>
<section id="settings" class="page"><div class="card"><b>🎯 減量設定</b><div class="row"><span>每日目標</span><input id="goalInput" type="number" min="1"></div><div class="row"><span>每包價格</span><input id="priceInput" type="number" min="0"></div><div class="row"><span>每包支數</span><input id="packInput" type="number" min="1"></div></div><div class="card"><b>💾 備份</b><p class="small">換手機或清除 Safari 資料前，建議先匯出。</p><button id="exportBtn" class="btn primary">匯出 JSON</button><label class="btn" style="display:inline-block;margin-left:5px">匯入 JSON<input id="importInput" type="file" accept=".json,application/json" style="display:none"></label></div></section></div>
<nav class="tabs"><button class="tab active" data-page="home"><b>⌂</b>今天</button><button class="tab" data-page="calendar"><b>▦</b>月曆</button><button class="tab" data-page="stats"><b>▥</b>統計</button><button class="tab" data-page="settings"><b>⚙︎</b>設定</button></nav>
<div id="modal" class="modal"><div class="sheet"><h3>這一支是因為？</h3><div id="reasons" class="reason-grid"></div><button id="closeModal" class="btn wide" style="margin-top:12px">取消</button></div></div>
<script>
(function(){
"use strict";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), KEY="smokelessTW_v2", RS=["工作","飯後","壓力","無聊","咖啡","社交","其他"];
const E={date:$("date"),count:$("count"),goal:$("goal"),bar:$("bar"),status:$("status"),since:$("since"),last:$("last"),avg:$("avg"),streak:$("streak"),week:$("week"),logs:$("logs"),modal:$("modal"),reasons:$("reasons"),mtitle:$("mtitle"),cal:$("cal"),selTitle:$("selTitle"),selLogs:$("selLogs"),mTotal:$("mTotal"),mCost:$("mCost"),rstats:$("rstats"),tstats:$("tstats"),goalInput:$("goalInput"),priceInput:$("priceInput"),packInput:$("packInput")};
let db;try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}if(!db||typeof db!=="object")db={logs:{},goal:10,price:120,perPack:20};if(!db.logs)db.logs={};if(!db.goal)db.goal=10;if(db.price==null)db.price=120;if(!db.perPack)db.perPack=20;
let calDate=new Date(),selected=null;
function k(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function a(x){return Array.isArray(db.logs[x])?db.logs[x]:[]} function save(){localStorage.setItem(KEY,JSON.stringify(db));render()} function fmt(t){return new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}
function add(r){let x=k();if(!Array.isArray(db.logs[x]))db.logs[x]=[];db.logs[x].push({time:new Date().toISOString(),reason:r});close();save()} function undo(){let x=a(k());if(x.length){x.pop();save()}}
function open(){E.modal.classList.add("show")} function close(){E.modal.classList.remove("show")}
function pg(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="calendar")renderCal();if(id==="stats")renderStats()}
function setSave(){db.goal=Math.max(1,Number(E.goalInput.value)||10);db.price=Math.max(0,Number(E.priceInput.value)||0);db.perPack=Math.max(1,Number(E.packInput.value)||20);save()}
function streak(){let n=0,d=new Date();for(let i=0;i<365;i++){let c=a(k(d)).length;if(c>0&&c<=db.goal)n++;else break;d.setDate(d.getDate()-1)}return n}
function home(){let now=new Date(),x=k(now),L=a(x),n=L.length;E.date.textContent=now.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"short"});E.count.textContent=n;E.goal.textContent=db.goal;E.bar.style.width=Math.min(100,n/db.goal*100)+"%";E.status.textContent=n===0?"今天還沒有紀錄":n<db.goal?`距離今日目標還有 ${db.goal-n} 支`:n===db.goal?"今天剛好達到目標":`今天超過目標 ${n-db.goal} 支`;
let z=L[L.length-1];if(z&&z.time){let s=Math.max(0,Math.floor((Date.now()-new Date(z.time).getTime())/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);E.since.textContent=h?`${h} 小時 ${m} 分`:`${m} 分鐘`;E.last.textContent="上一支："+fmt(z.time)}else{E.since.textContent="尚未紀錄";E.last.textContent=""}
let D=[],sum=0;for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);let c=a(k(d)).length;D.push([d,c]);sum+=c}E.avg.textContent=(sum/7).toFixed(1);E.streak.textContent=streak();let mx=Math.max(db.goal,...D.map(x=>x[1]),1);E.week.innerHTML=D.map(([d,c])=>`<div class="wb"><div class="cw"><div class="col" style="height:${Math.max(3,c/mx*100)}%"></div></div><b>${c}</b><div class="small">${d.toLocaleDateString("zh-TW",{weekday:"short"})}</div></div>`).join("");E.logs.innerHTML=L.length?L.slice().reverse().map((x,i)=>`<div class="row"><span>第 ${n-i} 支 · ${x.reason||"未分類"}</span><b>${fmt(x.time||x)}</b></div>`).join(""):'<div class="muted" style="padding-top:10px">尚無紀錄</div>'}
function renderCal(){E.mtitle.textContent=calDate.toLocaleDateString("zh-TW",{year:"numeric",month:"long"});let y=calDate.getFullYear(),m=calDate.getMonth(),f=new Date(y,m,1),l=new Date(y,m+1,0),h=["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("");for(let i=0;i<f.getDay();i++)h+='<div class="day empty"></div>';for(let d=1;d<=l.getDate();d++){let q=new Date(y,m,d),x=k(q),c=a(x).length,cl=c===0?"":c<=db.goal?"ok":c<=db.goal+2?"warn":"over";if(x===k())cl+=" today";h+=`<button class="day ${cl}" data-date="${x}"><b>${d}</b><div class="small">${c?c+" 支":""}</div></button>`}E.cal.innerHTML=h;E.cal.querySelectorAll("[data-date]").forEach(b=>b.addEventListener("click",()=>sel(b.dataset.date)));if(!selected)sel(k())}
function sel(x){selected=x;let L=a(x);E.selTitle.textContent=`${x} · ${L.length} 支`;E.selLogs.innerHTML=L.length?L.map((z,i)=>`<div class="row"><span>第 ${i+1} 支 · ${z.reason||"未分類"}</span><b>${fmt(z.time||z)}</b></div>`).join(""):'<div class="muted">沒有紀錄</div>'}
function renderStats(){let now=new Date(),mk=k(now).slice(0,7),total=Object.entries(db.logs).filter(([x])=>x.startsWith(mk)).reduce((s,[,L])=>s+(Array.isArray(L)?L.length:0),0);E.mTotal.textContent=total;E.mCost.textContent="$"+Math.round(total*db.price/db.perPack);let rc={};RS.forEach(r=>rc[r]=0);Object.values(db.logs).forEach(L=>Array.isArray(L)&&L.forEach(x=>{let r=x.reason||"其他";rc[r]=(rc[r]||0)+1}));E.rstats.innerHTML=Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([r,c])=>`<div class="row"><span>${r}</span><b>${c} 支</b></div>`).join("");let z=[];for(let i=29;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);z.push(a(k(d)).length)}let av=z.reduce((a,b)=>a+b,0)/30,old=z.slice(0,7).reduce((a,b)=>a+b,0)/7,recent=z.slice(-7).reduce((a,b)=>a+b,0)/7,diff=recent-old;E.tstats.innerHTML=`<div class="row"><span>30 天平均</span><b>${av.toFixed(1)} 支/天</b></div><div class="row"><span>最近 7 天變化</span><b>${diff>0?"+":""}${diff.toFixed(1)} 支/天</b></div>`}
function exp(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"})),x=document.createElement("a");x.href=u;x.download="SmokeLess_backup_"+k()+".json";document.body.appendChild(x);x.click();x.remove();URL.revokeObjectURL(u)}
function imp(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.logs)throw 0;db=x;save();alert("匯入完成")}catch(_){alert("檔案格式錯誤")}e.target.value=""};r.readAsText(f)}
function render(){E.goalInput.value=db.goal;E.priceInput.value=db.price;E.packInput.value=db.perPack;E.reasons.innerHTML="";RS.forEach(r=>{let b=document.createElement("button");b.className="reason";b.textContent=r;b.addEventListener("click",()=>add(r));E.reasons.appendChild(b)});home();renderCal();renderStats()}
$("undoBtn").addEventListener("click",undo);$("recordBtn").addEventListener("click",open);$("closeModal").addEventListener("click",close);E.modal.addEventListener("click",e=>{if(e.target===E.modal)close()});$("prevMonth").addEventListener("click",()=>{calDate.setMonth(calDate.getMonth()-1);renderCal()});$("nextMonth").addEventListener("click",()=>{calDate.setMonth(calDate.getMonth()+1);renderCal()});$("exportBtn").addEventListener("click",exp);$("importInput").addEventListener("change",imp);E.goalInput.addEventListener("change",setSave);E.priceInput.addEventListener("change",setSave);E.packInput.addEventListener("change",setSave);document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>pg(b.dataset.page,b)));
render();setInterval(home,30000);if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=2.1").catch(()=>{});
})();
</script></body></html>
